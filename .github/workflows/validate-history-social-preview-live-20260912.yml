name: Validate Historical Evolution live social preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-history-social-preview-live-20260912.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages propagation
        run: sleep 50
      - name: Fetch live page as LinkedIn crawler
        run: |
          set -euo pipefail
          URL='https://bhoctherapeutics.com/bhoc/historical-evolution/'
          UA='LinkedInBot/1.0 (+https://www.linkedin.com)'
          echo '=== PAGE HEADERS ==='
          curl -sSIL -A "$UA" "$URL"
          echo '=== FETCH PAGE ==='
          curl -fsSL --retry 3 --retry-delay 5 -A "$UA" "$URL" -o /tmp/page.html
          grep -F 'BHOC Historical Evolution: From Bloodletting to Oxygen Therapeutics' /tmp/page.html
          grep -F 'property="og:image"' /tmp/page.html
          grep -F 'property="og:image:url"' /tmp/page.html
          grep -F 'property="og:image:secure_url"' /tmp/page.html
          grep -F 'rel="image_src"' /tmp/page.html
          grep -F 'name="twitter:card" content="summary_large_image"' /tmp/page.html
          IMG=$(python - <<'PY'
          import re
          s=open('/tmp/page.html',encoding='utf-8').read()
          m=re.search(r'<meta property="og:image" content="([^"]+)"',s)
          assert m, 'og:image missing'
          print(m.group(1))
          PY
          )
          echo "OG_IMAGE=$IMG"
          echo '=== IMAGE HEADERS ==='
          curl -sSIL -A "$UA" "$IMG"
          echo '=== FETCH IMAGE ==='
          curl -fsSL --retry 3 --retry-delay 5 -A "$UA" "$IMG" -o /tmp/preview.png
          file /tmp/preview.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/preview.png')
          print('IMAGE_FORMAT=',im.format)
          print('IMAGE_SIZE=',im.size)
          assert im.size == (1200,630), im.size
          PY
