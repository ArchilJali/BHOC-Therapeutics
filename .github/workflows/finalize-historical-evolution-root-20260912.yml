name: Finalize Historical Evolution root URL

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize_historical_evolution_root_20260912.cjs'
      - '.github/workflows/finalize-historical-evolution-root-20260912.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply final route migration
        run: |
          git pull --rebase origin main
          node scripts/finalize_historical_evolution_root_20260912.cjs
      - name: Commit final route
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Historical Evolution root canonical URL"
          git pull --rebase origin main
          git push
