name: Add 2026 blood-group context

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_blood_group_2026_context_20260912.cjs'
      - '.github/workflows/add-blood-group-2026-context-20260912.yml'

permissions:
  contents: write

concurrency:
  group: bhoc-history-blood-group-context
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply blood-group context update
        run: |
          git pull --rebase origin main
          node scripts/add_blood_group_2026_context_20260912.cjs
      - name: Commit page update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add bhoc/history/index.html
          git commit -m "Add 2026 blood group context and renewal note"
          git pull --rebase origin main
          git push
