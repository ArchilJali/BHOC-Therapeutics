name: Sync Open Discussion links

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_open_discussion_links.cjs'
      - '.github/workflows/sync-open-discussion-links.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-open-discussion-navigation
  cancel-in-progress: false

jobs:
  sync-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Open Discussion navigation and contextual links
        run: |
          git pull --rebase origin main
          node scripts/sync_open_discussion_links.cjs

      - name: Commit generated updates
        run: |
          if git diff --quiet; then
            echo "Open Discussion links already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Open Discussion links"
          git pull --rebase origin main
          git push
