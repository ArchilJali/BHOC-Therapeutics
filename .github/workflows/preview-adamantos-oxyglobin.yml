name: Add Adamantos Oxyglobin review and reconcile counters
on:
  push:
    branches:
      - 'preview/adamantos-oxyglobin-2005-20261102'
    paths:
      - 'scripts/add_adamantos_oxyglobin_2005.py'
      - '.github/workflows/preview-adamantos-oxyglobin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/preview/adamantos-oxyglobin-2005-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add publication only if absent
        run: python3 scripts/add_adamantos_oxyglobin_2005.py
      - name: Rebuild all canonical search views and statistics
        run: python3 scripts/build_evidence_catalogues.py
      - name: Synchronize all evidence overviews and metrics endpoints
        run: python3 scripts/sync_evidence_overviews.py
      - name: Audit records, counts, links and structured data
        run: python3 scripts/check_evidence_catalogues.py
      - name: Check preserved content and site
        run: |
          node scripts/check_bhoc_content.mjs
          node scripts/check_site.mjs
          node --check navigation-context.js
          git diff --check
      - name: Report current counter surfaces
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          base=Path('evidence/library')
          stats=json.loads((base/'catalogues/data/statistics.json').read_text())
          print(json.dumps({'publicationCounter':stats['publicationCounter'],'views':stats['views'],'uniquePublications':stats['publicRecords']},indent=2))
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or 'news/knowledge-updates' in str(p):
                  continue
              text=p.read_text(errors='replace')
              for m in re.finditer(r'(?<!\d)(?:994|294)(?!\d)',text):
                  context=text[max(0,m.start()-65):m.end()+100]
                  if re.search(r'(?:publication|library entries|records|counter)',context,re.I):
                      print('REVIEW_OLD_COUNTER',str(p),re.sub(r'\s+',' ',context))
          PY
      - name: Commit validated catalogue and synchronized counters
        run: |
          git config user.name "BHOC evidence automation"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/library/ evidence/index.html scripts/check_evidence_catalogues.py
          if ! git diff --cached --quiet; then
            git commit -m "Add Adamantos 2005 review and synchronize publication counters"
            git push origin HEAD:preview/adamantos-oxyglobin-2005-20261102
          fi
