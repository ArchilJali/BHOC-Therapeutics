name: Patch BHOC history hub
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_bhoc_history.cjs'
      - '.github/workflows/patch-bhoc-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Patch BHOC history hub
        run: node scripts/patch_bhoc_history.cjs
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'Archil Jaliashvili'
          git config user.email 'archil.jali@gmail.com'
          git add bhoc/index.html
          git commit -m 'Link BHOC hub to Historical Perspective'
          git push
