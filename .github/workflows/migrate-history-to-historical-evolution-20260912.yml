name: Migrate Historical Evolution URL

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_history_to_historical_evolution_20260912.cjs'
      - '.github/workflows/migrate-history-to-historical-evolution-20260912.yml'

permissions:
  contents: write

concurrency:
  group: bhoc-historical-evolution-url-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply URL migration
        run: |
          git pull --rebase origin main
          node scripts/migrate_history_to_historical_evolution_20260912.cjs
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Move Historical Evolution to SEO-friendly URL"
          git pull --rebase origin main
          git push
