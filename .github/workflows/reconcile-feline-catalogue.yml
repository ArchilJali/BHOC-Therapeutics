name: Reconcile feline bibliography and all evidence counters
on:
  push:
    branches:
      - 'preview/feline-catalogue-20261103'
    paths:
      - 'scripts/reconcile_feline_catalogue_20261103.py'
      - '.github/workflows/reconcile-feline-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/preview/feline-catalogue-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Keep non-Oxyglobin formulations out of the product facet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/reconcile_feline_catalogue_20261103.py')
          s=p.read_text()
          s=s.replace("'Tetrameric cross-linked haemoglobin; not Oxyglobin',", "'Tetrameric cross-linked haemoglobin (experimental formulation)',")
          s=s.replace("'Zero-link haemoglobin polymer; not Oxyglobin',", "'Zero-link haemoglobin polymer (experimental formulation)',")
          p.write_text(s)
          PY
      - name: Reconcile sources, rebuild and validate every shared counter
        run: |
          {
            python3 scripts/reconcile_feline_catalogue_20261103.py
            python3 scripts/build_evidence_catalogues.py
            python3 scripts/sync_evidence_overviews.py
            python3 scripts/check_evidence_catalogues.py
            node scripts/check_bhoc_content.mjs
            node scripts/check_site.mjs
            git diff --check
          } 2>&1 | tee /tmp/feline-validation.log
      - name: Commit only validated catalogue changes
        run: |
          git config user.name "BHOC evidence automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/reconcile_feline_catalogue_20261103.py scripts/check_evidence_catalogues.py evidence/library/ evidence/index.html
          git diff --cached --stat | tee /tmp/feline-changed-files.txt
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile feline species tags, add requested bibliography and synchronize all counters"
            git push origin HEAD:preview/feline-catalogue-20261103
          fi
      - name: Retain validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feline-catalogue-validation
          path: |
            /tmp/feline-validation.log
            /tmp/feline-changed-files.txt
            evidence/library/catalogues/data/feline-literature-review-20261103.json
            evidence/library/catalogues/data/statistics.json
          retention-days: 14
