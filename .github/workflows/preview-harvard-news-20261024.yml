name: Prepare Harvard Biopure news preview
on:
  push:
    branches: [preview/harvard-biopure-news-20261024]
    paths:
      - scripts/publish_harvard_news_20261024.py
      - .github/workflows/preview-harvard-news-20261024.yml
permissions:
  contents: write
concurrency:
  group: harvard-news-preview-20261024
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the approved preview branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: preview/harvard-biopure-news-20261024
      - name: Prepare the existing illustration and news
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          sed -i "s/DATE+'T10:00:00+04:00'/DATE/g" scripts/publish_harvard_news_20261024.py
          python3 scripts/publish_harvard_news_20261024.py
      - name: Validate preserved content and site
        run: |
          node scripts/check_bhoc_content.mjs
          node scripts/check_site.mjs
          python3 scripts/check_evidence_catalogues.py
          node --check navigation-context.js
          git diff --check
      - name: Commit only the requested public assets and pages to preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/news/harvard-biopure-1998-editorial.jpg news/harvard-business-school-biopure-case-1998/index.html news/index.html news/knowledge-updates/index.html sitemap.xml
          git diff --cached --stat
          git commit -m 'Add illustrated Harvard Biopure news and internal source links'
          git push origin HEAD:preview/harvard-biopure-news-20261024
