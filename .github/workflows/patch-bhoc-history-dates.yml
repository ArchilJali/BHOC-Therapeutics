name: Patch BHOC history related-page dates

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_bhoc_history_dates.cjs'
      - '.github/workflows/patch-bhoc-history-dates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Apply date labels
        run: node scripts/patch_bhoc_history_dates.cjs
      - name: Commit BHOC hub update
        shell: bash
        run: |
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add bhoc/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add update dates to BHOC history related links"
          git pull --rebase origin main
          git push
