name: Refine HEMARINA unity of function

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine_hemarina_unity_function_20260912.cjs'
      - '.github/workflows/refine-hemarina-unity-function-20260912.yml'

permissions:
  contents: write

concurrency:
  group: bhoc-therapeutics-content-write
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d3f7d6820020
        with:
          node-version: '22'
      - name: Apply HEMARINA framing update
        run: node scripts/refine_hemarina_unity_function_20260912.cjs
      - name: Commit page update
        shell: bash
        run: |
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add bhoc/history/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine HEMARINA cross-species oxygen function framing"
          git pull --rebase origin main
          git push
