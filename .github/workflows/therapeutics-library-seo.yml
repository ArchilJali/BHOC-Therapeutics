name: BHOC Therapeutics Full Sitemap Verification
on:
  push:
    branches: [preview/therapeutics-web-seo-20261104]
    paths: ['.github/workflows/therapeutics-library-seo.yml', 'seo-bot/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify both public sitemaps
        run: |
          mkdir -p output
          python3 - <<'PY'
          import concurrent.futures,collections,datetime,json,time,urllib.request,urllib.error,urllib.parse,urllib.robotparser,xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          B='https://bhoctherapeutics.com'; NOW=datetime.datetime.now(datetime.timezone.utc).isoformat();OUT=Path('output');UA='BHOC-Owner-SEO-Verification/1.0'
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  p=urllib.parse.urlsplit(newurl)
                  if p.scheme!='https' or p.hostname not in ('bhoctherapeutics.com','www.bhoctherapeutics.com') or p.username:raise urllib.error.HTTPError(req.full_url,code,'Out-of-scope redirect',headers,fp)
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def get(u):
              try:
                  with urllib.request.build_opener(SafeRedirect()).open(urllib.request.Request(u,headers={'User-Agent':UA}),timeout=20) as r:return r.status,r.read(3000000).decode('utf-8','replace'),r.url,r.headers.get('X-Robots-Tag','')
              except urllib.error.HTTPError as e:return e.code,'',u,str(e)
              except Exception as e:return None,'',u,str(e)
          class Parse(HTMLParser):
              def __init__(self):
                  super().__init__();self.title='';self.h1=0;self.desc=[];self.canon=[];self.robots=[];self.jsonld=0;self.badjson=0;self.t=False;self.j=False;self.buf='';self.viewport=False
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='title':self.t=True
                  if t=='h1':self.h1+=1
                  if t=='meta':
                      n=a.get('name','').lower()
                      if n=='description':self.desc.append(a.get('content',''))
                      if n in ('robots','googlebot'):self.robots.append(a.get('content',''))
                      if n=='viewport':self.viewport=True
                  if t=='link' and 'canonical' in a.get('rel','').split():self.canon.append(a.get('href',''))
                  if t=='script' and a.get('type','')=='application/ld+json':self.j=True;self.buf='';self.jsonld+=1
              def handle_data(self,s):
                  if self.t:self.title+=s
                  if self.j:self.buf+=s
              def handle_endtag(self,t):
                  if t=='title':self.t=False
                  if t=='script' and self.j:
                      try:json.loads(self.buf)
                      except ValueError:self.badjson+=1
                      self.j=False
          rs,rt,_,_=get(B+'/robots.txt');rp=urllib.robotparser.RobotFileParser();rp.parse(rt.splitlines())
          maps={};lastmods={}
          for route in ('/sitemap.xml','/evidence/library/sitemap.xml'):
              code,body,_,err=get(B+route); urls=[]
              if code==200:
                  root=ET.fromstring(body)
                  for item in root.findall('{*}url'):
                      u=item.findtext('{*}loc');lm=item.findtext('{*}lastmod')
                      if u and urllib.parse.urlsplit(u).hostname=='bhoctherapeutics.com':urls.append(u);lastmods[u]=lm
              maps[route]={'status':code,'urls':urls,'error':err if code!=200 else None}
          urls=sorted({u for m in maps.values() for u in m['urls']})
          def check(u):
              if rs==200 and not rp.can_fetch(UA,u):return {'url':u,'status':None,'issues':['robots_disallow']}
              code,text,final,header=get(u);d={'url':u,'status':code,'final_url':final,'lastmod':lastmods.get(u),'checked_at':NOW,'issues':[]}
              if code!=200:d['issues'].append('http_or_fetch');return d
              p=Parse();p.feed(text);d.update(title=' '.join(p.title.split()),description=p.desc,canonical=p.canon,h1_count=p.h1,jsonld_blocks=p.jsonld,invalid_jsonld=p.badjson,viewport=p.viewport)
              if not d['title']:d['issues'].append('missing_title')
              if not any(p.desc):d['issues'].append('missing_description')
              if p.canon!=[u]:d['issues'].append('canonical_mismatch')
              if p.h1!=1:d['issues'].append('h1_count')
              if p.badjson:d['issues'].append('invalid_jsonld')
              if 'noindex' in (' '.join(p.robots)+' '+header).lower():d['issues'].append('noindex')
              time.sleep(.05);return d
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:pages=list(ex.map(check,urls[:600]))
          dup={}
          for field in ('title','description'):
              g=collections.defaultdict(list)
              for d in pages:
                  v=d.get(field,'');v=' '.join(v) if isinstance(v,list) else v
                  if v:g[v.lower()].append(d['url'])
              dup[field]={k:v for k,v in g.items() if len(v)>1}
          summary={'checked_at':NOW,'sitemap_counts':{k:len(v['urls']) for k,v in maps.items()},'unique_live_urls_checked':len(pages),'http_counts':dict(collections.Counter(str(d['status']) for d in pages)),'issue_counts':dict(collections.Counter(x for d in pages for x in d['issues'])),'duplicate_title_groups':len(dup['title']),'duplicate_description_groups':len(dup['description']),'without_json_ld':[d['url'] for d in pages if d.get('status')==200 and not d.get('jsonld_blocks')],'production_changed':False,'limitations':['HTML source and HTTP checks only; no rendering/Core Web Vitals/Google indexing/rankings.','JSON syntax does not establish rich-result eligibility.','No clinical review or treatment recommendations.']}
          for name,data in [('full-summary.json',summary),('full-live-pages.json',pages),('full-sitemaps.json',maps),('full-duplicates.json',dup)]: (OUT/name).write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bhoc-therapeutics-full-sitemap-verification
          path: output/
          retention-days: 30
