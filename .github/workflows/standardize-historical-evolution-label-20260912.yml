name: Standardize Historical Evolution label

on:
  push:
    branches: [main]
    paths:
      - 'scripts/standardize_historical_evolution_label_20260912.cjs'
      - '.github/workflows/standardize-historical-evolution-label-20260912.yml'

permissions:
  contents: write

concurrency:
  group: bhoc-history-label-sync
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply naming sync
        run: |
          git pull --rebase origin main
          node scripts/standardize_historical_evolution_label_20260912.cjs
      - name: Commit updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Standardize Historical Evolution naming and sitemap"
          git pull --rebase origin main
          git push
