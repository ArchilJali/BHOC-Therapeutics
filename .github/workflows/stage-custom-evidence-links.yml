name: Stage branded Evidence links
on:
  push:
    branches: ['preview/custom-evidence-links-20260912']
    paths:
      - 'scripts/stage_custom_evidence_links.py'
      - '.github/workflows/stage-custom-evidence-links.yml'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/stage_custom_evidence_links.py
      - name: Commit staged branded links
        run: |
          git config user.name "BHOC Domain Migration"
          git config user.email "actions@users.noreply.github.com"
          git add . ':!scripts/stage_custom_evidence_links.py' ':!.github/workflows/stage-custom-evidence-links.yml'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage branded BHOC Evidence links"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
