name: Science production verification
on:
  push:
    branches: ['fix/science-layout-seo-20261103']
    paths: ['.github/workflows/science-layout-seo-20261103.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: |
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Verify current main after navigation integration
        run: |
          mkdir -p /tmp/bhoc-science
          python - <<'PY'
          from pathlib import Path
          import zipfile
          paths=list(Path('evidence/library/science').glob('*.html'))+[Path('science/rbc-unit-hemoglobin-dose-variability.html'),Path('science/hypoxic-rbc-storage-kidney-oxygen-delivery.html')]
          with zipfile.ZipFile('/tmp/bhoc-science/source-before.zip','w') as z:
            for p in paths:z.write(p)
          PY
          python scripts/check_science_layout_20261103.py
          node scripts/check_bhoc_content.mjs
          node scripts/check_site.mjs
      - name: Verify actual public domain
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          paths=sorted(Path('evidence/library/science').glob('*.html'))+[Path('evidence/library/science/page/2/index.html'),Path('science/rbc-unit-hemoglobin-dose-variability.html'),Path('science/hypoxic-rbc-storage-kidney-oxygen-delivery.html')]
          results=[]
          with sync_playwright() as pw:
            browser=pw.chromium.launch()
            for width in (390,1440):
              ctx=browser.new_context(viewport={'width':width,'height':1000})
              for path in paths:
                page=ctx.new_page()
                response=page.goto('https://bhoctherapeutics.com/'+str(path),wait_until='networkidle',timeout=45000)
                page.wait_for_selector('.bhoc-shell-header')
                result=page.evaluate('''() => ({url:location.href,width:innerWidth,scroll:document.documentElement.scrollWidth,mainWidth:document.querySelector('main').getBoundingClientRect().width,refresh:document.body.dataset.scienceRefresh,h1:document.querySelector('h1').textContent,css:[...document.styleSheets].map(s=>s.href).filter(Boolean)})''')
                result['status']=response.status
                assert result['status']==200,result
                assert result['refresh']=='20261103',result
                assert any('science-20261103.css' in u for u in result['css']),result
                assert result['scroll']<=width+1,result
                assert result['mainWidth']<=1180.5,result
                if width==1440:assert result['mainWidth']>1100,result
                results.append(result)
                name=('index' if str(path)=='evidence/library/science/index.html' else 'page2' if '/page/2/' in str(path) else path.stem)
                page.screenshot(path='/tmp/bhoc-science/live-'+name+'-'+str(width)+'.png')
                page.close()
              ctx.close()
            ctx=browser.new_context();page=ctx.new_page()
            page.goto('https://bhoctherapeutics.com/evidence/library/science/?page=2',wait_until='networkidle',timeout=45000)
            assert '/science/page/2/' in page.url,page.url
            assert page.locator('.science-cards .paper-card').count()==4
            ctx.close();browser.close()
          Path('/tmp/bhoc-science/live-verification.json').write_text(json.dumps({'result':'PASS','rendered_pages':len(results),'pages':results},indent=2))
          print(json.dumps({'result':'PASS','rendered_pages':len(results),'legacy_page2':'PASS'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: science-production-verification
          path: /tmp/bhoc-science/
          retention-days: 14
