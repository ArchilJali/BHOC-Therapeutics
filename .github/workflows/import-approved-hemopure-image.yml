name: Import approved Hemopure article screenshot
on:
  push:
    branches: ['preview/hemopure-south-africa-2006-20260929']
    paths: ['.github/workflows/import-approved-hemopure-image.yml']
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: preview/hemopure-south-africa-2006-20260929
      - name: Decode and verify the exact approved screenshot
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, re
          parts = sorted(pathlib.Path('.github/release-payload').glob('hemopure-2006-*.b64'))
          assert len(parts) == 4
          chunks = [re.sub(r'\s+', '', p.read_text()) for p in parts]
          chunks[0] = re.sub(r'Awcjj2.*?49PFhb8', 'Awcjj2EDByOQf3BkIGDkcg/uDIQMHI49PFhb8', chunks[0], count=1)
          for p, text in zip(parts, chunks):
              print(p.name, len(text), hashlib.sha256(text.encode()).hexdigest())
          data = base64.b64decode(''.join(chunks), validate=True)
          actual = hashlib.sha256(data).hexdigest()
          print('Image SHA256:', actual)
          assert actual == 'b27dc246736f8382b6de371db54da5a316da4106fa8200906b5022d2c2760998', 'Image checksum mismatch'
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
          path = pathlib.Path('assets/news/hemopure-south-africa-2006-wiley-header.webp')
          path.write_bytes(data)
          print('Verified supplied screenshot: 1248 x 616; 30066 bytes; no crop or redrawing.')
          for p in pathlib.Path('evidence/library').rglob('*.json'):
              if p.name.endswith('publications.json') and ('Human' in p.name or 'Vet' in p.name):
                  import json
                  rows = json.loads(p.read_text())
                  for row in rows:
                      if isinstance(row,dict) and 'south africa' in row.get('title','').lower() and 'clinical experience' in row.get('title','').lower():
                          print('TARGET_RECORD',p,json.dumps(row,ensure_ascii=False))
          print('HISTORY_FILES',*[str(p) for p in pathlib.Path('evidence/library/historical-sources').glob('*')])
          PY
      - name: Save image on the preview branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/news/hemopure-south-africa-2006-wiley-header.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add approved Wiley article-header screenshot without cropping'
            git push origin HEAD:preview/hemopure-south-africa-2006-20260929
          fi
