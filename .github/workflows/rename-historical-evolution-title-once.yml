name: One-time historical evolution title update

on:
  push:
    paths:
      - '.github/workflows/rename-historical-evolution-title-once.yml'

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace historical evolution title
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bhoc/historical-evolution/index.html')
          old = 'From Bloodletting to Oxygen Therapeutics'
          new = 'From Bloodletting to Precision Oxygen Therapeutics'

          text = path.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'Expected exactly 4 title occurrences, found {count}; no file was changed.')

          path.write_text(text.replace(old, new), encoding='utf-8')
          print(f'Replaced {count} title occurrences.')
          PY

      - name: Commit title update
        run: |
          if git diff --quiet -- bhoc/historical-evolution/index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bhoc/historical-evolution/index.html
          git commit -m 'Update historical evolution title'
          git push
