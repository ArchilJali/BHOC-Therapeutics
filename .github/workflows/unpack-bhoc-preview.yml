name: Build BHOC 2026 staging preview

on:
  push:
    branches:
      - bhoc-2026-production-preview
    paths:
      - .github/workflows/unpack-bhoc-preview.yml

permissions:
  contents: write

jobs:
  unpack-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: bhoc-2026-production-preview
          fetch-depth: 0

      - name: Reconstruct verified preview package
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/bhoc-preview/chunk* > /tmp/bhoc-preview.tar.gz.b64
          base64 --decode /tmp/bhoc-preview.tar.gz.b64 > /tmp/bhoc-preview.tar.gz
          tar -xzf /tmp/bhoc-preview.tar.gz -C .
          rm -rf .deploy/bhoc-preview

      - name: Commit generated staging pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BHOC Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A preview-2026 preview-2026.html .deploy/bhoc-preview
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build responsive BHOC 2026 staging preview"
          git push origin HEAD:bhoc-2026-production-preview
