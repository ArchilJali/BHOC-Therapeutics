name: Build BHOC 2026 staging preview

on:
  push:
    branches:
      - bhoc-2026-production-preview
    paths:
      - .deploy/bhoc-preview/package.b64

permissions:
  contents: write

jobs:
  unpack-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: bhoc-2026-production-preview
          fetch-depth: 0

      - name: Verify and unpack the staging package
        shell: bash
        run: |
          set -euo pipefail
          test -s .deploy/bhoc-preview/package.b64
          tr -d '\r\n\t ' < .deploy/bhoc-preview/package.b64 | base64 --decode > /tmp/bhoc-preview.tar.gz
          echo "e50df67e809930e1206d63126225d45152c7de6e36096b4b6628fd52bfc3bd2d  /tmp/bhoc-preview.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/bhoc-preview.tar.gz >/dev/null
          tar -xzf /tmp/bhoc-preview.tar.gz -C .

      - name: Commit the generated preview pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BHOC Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A preview-2026 preview-2026.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build responsive BHOC 2026 staging preview"
          git push origin HEAD:bhoc-2026-production-preview
