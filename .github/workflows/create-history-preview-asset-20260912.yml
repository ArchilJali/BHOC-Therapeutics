name: Create Historical Evolution preview asset

on:
  push:
    branches: [main]
    paths:
      - 'scripts/create_history_preview_asset_20260912.cjs'
      - '.github/workflows/create-history-preview-asset-20260912.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Create dedicated preview asset
        run: |
          git pull --rebase origin main
          node scripts/create_history_preview_asset_20260912.cjs
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/bhoc-historical-evolution-preview-20260912.png bhoc/historical-evolution/index.html
          git commit -m "Use dedicated social preview for Historical Evolution"
          git pull --rebase origin main
          git push
