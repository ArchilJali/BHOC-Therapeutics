name: Restore single Historical Evolution URL

on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore_single_history_url_20260912.cjs'
      - '.github/workflows/restore-single-history-url-20260912.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Restore one canonical route
        run: |
          git pull --rebase origin main
          node scripts/restore_single_history_url_20260912.cjs
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore single Historical Evolution canonical URL"
          git pull --rebase origin main
          git push
