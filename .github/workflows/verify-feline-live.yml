name: Verify live feline catalogue release
on:
  push:
    branches: ['preview/feline-catalogue-20261103']
    paths: ['.github/workflows/verify-feline-live.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check published pages and statistics
        run: |
          python3 - <<'PY' | tee /tmp/feline-live-verification.json
          import json, time, urllib.request
          from html.parser import HTMLParser
          root='https://bhoctherapeutics.com'
          def get(path):
              url=root+path+('&' if '?' in path else '?')+'release_check='+str(int(time.time()))
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'BHOC-publication-audit/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  assert r.status==200
                  return r.read().decode('utf-8')
          class Page(HTMLParser):
              def __init__(self,text):
                  super().__init__();self.rows=[];self.feed(text)
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='article' and a.get('class')=='publication':self.rows.append(a)
          report={}
          stats=json.loads(get('/evidence/library/catalogues/data/statistics.json'))
          assert stats['views']['veterinary']['records']==302,stats
          assert stats['publicRecords']==683,stats
          assert stats['publicationCounter']['displayedTotal']==1002,stats
          rows=Page(get('/evidence/library/veterinary/Vet-search.html?species=Feline+%28Cat%29')).rows
          cats=[r for r in rows if 'Feline (Cat)' in r.get('data-species','').split('|')]
          assert len(rows)==302 and len(cats)==20,(len(rows),len(cats))
          assert all('ferrets' not in r.get('data-title','').lower() for r in cats)
          black=next(r for r in cats if r['id']=='pub-e14d170bfce1')
          assert black['data-year']=='2016'
          assert any(r['id']=='pub-b0353dd04373' for r in cats)
          rebel=[r for r in cats if r['id'].startswith('pub-feline-rebel')]
          assert len(rebel)==2 and all('Oxyglobin' not in r.get('data-product','') for r in rebel)
          assert len([r for r in cats if r['id'].startswith('pub-feline-')])==7
          annual=get('/evidence/library/historical-sources/biopure-annual-report-2001/')
          assert 'Biopure Annual Report 2001' in annual
          overview=get('/evidence/library/veterinary/Vet-index.html')
          combined=get('/evidence/library/catalogues/')
          assert '1002</strong>' in combined
          report={'status':'PASS','felineRecords':len(cats),'veterinaryRecords':len(rows),'distinctPublicRecords':stats['publicRecords'],'displayCounter':stats['publicationCounter']['displayedTotal'],'newRecordsPresent':7,'blackYear':black['data-year'],'ferretExcluded':True,'otherCarriersNotOxyglobin':True,'annualReportStatus':200,'canonicalHost':root}
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feline-live-verification
          path: /tmp/feline-live-verification.json
          retention-days: 7
