name: BHOC Therapeutics Live SEO and UX Review
on:
  workflow_dispatch:
  push:
    branches: ['preview/therapeutics-web-seo-20261104']
    paths:
      - '.github/workflows/therapeutics-ux-review.yml'
      - 'seo-bot/ux_review.py'
      - 'seo-bot/UX-REQUEST.md'
permissions:
  contents: read
concurrency:
  group: therapeutics-ux-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          path: source
      - name: Install isolated inspection tools
        run: |
          python -m pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Validate and run read-only inspection
        run: |
          python -m py_compile runner/seo-bot/ux_review.py
          python runner/seo-bot/ux_review.py --source source --out output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhoc-therapeutics-seo-ux-review
          path: output/
          retention-days: 30
