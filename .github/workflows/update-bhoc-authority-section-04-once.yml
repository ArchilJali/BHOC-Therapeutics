name: Update BHOC authority section 04 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-bhoc-authority-section-04-once.yml'

permissions:
  contents: write

concurrency:
  group: bhoc-authority-section-04-once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Develop tissue-level authority subsection
        env:
          SECTION_B64: 
        run: |
          python <<'PY'
          import base64, os
          from pathlib import Path

          path = Path('bhoc/index.html')
          text = path.read_text()
          new_section = base64.b64decode(os.environ['SECTION_B64']).decode()

          replacements = [
              ('<a href="#tissue-control"><small>04 · Tissue level</small><strong>Microcirculation, diffusion and mitochondrial demand</strong><span>Section prepared ↓</span></a>', '<a href="#tissue-control"><small>04 · Tissue level</small><strong>Microcirculation, diffusion and mitochondrial demand</strong><span>Read section ↓</span></a>', 'section 04 roadmap status'),
              ('<section class="content-section bhoc-anchor" id="tissue-control"><div class="section-copy"><p class="eyebrow">04 · Tissue level</p><h2>Microcirculation, diffusion and mitochondrial demand</h2><p><em>Subsection created. Detailed mechanism and evidence remain reserved for structured development.</em></p></div></section>', new_section, 'section 04 content'),
              ('"dateModified":"2026-09-14"', '"dateModified":"2026-09-15"', 'schema dateModified'),
              ('First published 10 Sep 2026 · Updated 14 Sep 2026 · Version 26.09.14', 'First published 10 Sep 2026 · Updated 15 Sep 2026 · Version 26.09.15', 'page version'),
          ]

          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected {label}; refusing partial update')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          node scripts/check_site.mjs

      - name: Commit authority subsection
        run: |
          git rm .github/workflows/update-bhoc-authority-section-04-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bhoc/index.html
          git commit -m 'Develop BHOC tissue-level authority section'
          git pull --rebase origin main
          git push
