name: Preview compact BHOC cards and variation routes
on:
  push:
    branches: ['preview/bhoc-compact-variation-20260917']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-bhoc-compact-variation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: preview/bhoc-compact-variation-20260917
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify current protected site
        run: |
          node scripts/check_bhoc_content.mjs
          node scripts/check_site.mjs
      - name: Apply requested visual and variation changes
        run: python .github/scripts/apply_compact_variation_patch.py
      - name: Verify protected content, links and SEO
        run: |
          node scripts/check_bhoc_content.mjs
          node scripts/check_site.mjs
          node --check bhoc/knowledge-map.js
          git diff --check
      - name: Install browser checks
        run: |
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Run targeted desktop/mobile checks
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          import os,shutil
          root=Path('.')
          html=(root/'bhoc/index.html').read_text(); css=(root/'bhoc/knowledge-map.css').read_text(); js=(root/'bhoc/knowledge-map.js').read_text()
          soup=BeautifulSoup(html,'html.parser')
          style=soup.new_tag('style');style.string=css;soup.head.append(style)
          script=soup.new_tag('script');script.string=js;soup.body.append(script)
          doc=str(soup)
          with sync_playwright() as p:
            exe=os.environ.get('BHOC_CHROMIUM') or shutil.which('chromium')
            opts={'headless':True,'args':['--no-sandbox']}
            if exe:opts['executable_path']=exe
            browser=p.chromium.launch(**opts)
            for width in (1440,390):
              page=browser.new_page(viewport={'width':width,'height':900})
              errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              page.set_content(doc,wait_until='domcontentloaded')
              assert page.locator('.topic-code').count()==15
              assert page.locator('#human-variation .topic-code').inner_text()=='09.1'
              assert page.locator('#animal-variation').get_attribute('href')=='https://bhocvet.com/'
              assert page.locator('#animal-variation .topic-code').inner_text()=='09.2'
              assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
              assert not errors,errors
              page.close()
            # Verify Animal Variation appears in a real chapter mobile menu through shared JS.
            rbc=BeautifulSoup((root/'bhoc/red-blood-cell/index.html').read_text(),'html.parser')
            st=rbc.new_tag('style');st.string=css;rbc.head.append(st)
            sc=rbc.new_tag('script');sc.string=js;rbc.body.append(sc)
            page=browser.new_page(viewport={'width':390,'height':900});page.set_content(str(rbc),wait_until='domcontentloaded')
            menu=page.locator('.mobile-map').first;menu.locator('summary').click()
            assert menu.locator('a[data-animal-variation]').count()==1
            assert menu.locator('a[data-animal-variation]').get_attribute('href')=='https://bhocvet.com/'
            browser.close()
          print('PASS compact cards, Human/Animal Variation, mobile route, no overflow or JS errors.')
          PY
      - name: Commit only site files after validation
        run: |
          git add bhoc/index.html bhoc/knowledge-map.css bhoc/knowledge-map.js bhoc/knowledge-map-baseline.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Tighten BHOC overview cards and add Human/Animal Variation routes'
            git push origin HEAD:preview/bhoc-compact-variation-20260917
          fi
