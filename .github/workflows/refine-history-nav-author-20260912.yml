name: Refine BHOC history navigation and author block

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine_history_nav_author_20260912.cjs'
      - '.github/workflows/refine-history-nav-author-20260912.yml'

permissions:
  contents: write

concurrency:
  group: bhoc-history-nav-author
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply navigation and author update
        run: |
          git pull --rebase origin main
          node scripts/refine_history_nav_author_20260912.cjs
      - name: Commit page update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add bhoc/index.html bhoc/history/index.html
          git commit -m "Refine Historical Evolution navigation and article footer"
          git pull --rebase origin main
          git push
