name: Enforce HTTPS once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-https-once.yml'

permissions:
  pages: write

jobs:
  enforce:
    if: github.repository == 'ArchilJali/BHOC-Therapeutics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable HTTPS for GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data '{"https_enforced":true}'
