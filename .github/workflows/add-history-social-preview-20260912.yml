name: Add Historical Evolution social preview

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_history_social_preview_20260912.cjs'
      - '.github/workflows/add-history-social-preview-20260912.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply social preview metadata
        run: |
          git pull --rebase origin main
          node scripts/add_history_social_preview_20260912.cjs
      - name: Commit page update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BHOC Therapeutics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add bhoc/historical-evolution/index.html
          git commit -m "Add rich social preview to Historical Evolution"
          git pull --rebase origin main
          git push
