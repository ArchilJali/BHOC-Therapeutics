<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Biophysics of the BHOC Breakthrough</title>
<desc id="d">Popular-science comparison of an electric performance car, Formula 1 engineering, hemoglobin molecular switching and the BHOC concept.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset=".52" stop-color="#0d2d48"/><stop offset="1" stop-color="#390b18"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff355e"/><stop offset="1" stop-color="#a8002e"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30c6ff"/><stop offset="1" stop-color="#2064ff"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff3a3"/><stop offset=".45" stop-color="#ffd34a"/><stop offset="1" stop-color="#ff9b2f"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1410" cy="150" r="300" fill="#ff2455" opacity=".07"/><circle cx="210" cy="730" r="360" fill="#25bfff" opacity=".06"/>
<text x="90" y="92" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800">BIOPHYSICS OF THE <tspan fill="#ff3358">BHOC</tspan> BREAKTHROUGH</text>
<text x="92" y="138" fill="#aeeeff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600">Hemoglobin as Nature’s Super-Engine — a popular-science comparison of timescales</text>

<!-- three comparison cards -->
<g transform="translate(85 205)" filter="url(#shadow)">
  <rect width="430" height="245" rx="30" fill="#0d2235" stroke="#2d90c5" stroke-width="2"/>
  <path d="M46 147 C95 108 157 93 241 95 C298 95 345 110 385 141 L369 161 H66 Z" fill="url(#blue)" opacity=".95"/>
  <circle cx="122" cy="168" r="30" fill="#08131c" stroke="#6fd6ff" stroke-width="6"/><circle cx="326" cy="168" r="30" fill="#08131c" stroke="#6fd6ff" stroke-width="6"/>
  <path d="M98 130 L157 99 L277 99 L340 131" fill="none" stroke="#d7f7ff" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <text x="34" y="45" fill="#fff" font-size="26" font-weight="800" font-family="Arial">ELECTRIC PERFORMANCE CAR</text>
  <text x="34" y="78" fill="#8ddfff" font-size="19" font-family="Arial">seconds → milliseconds</text>
  <text x="34" y="219" fill="#fff" font-size="18" font-family="Arial">Power • sensors • software • torque control</text>
</g>

<g transform="translate(585 205)" filter="url(#shadow)">
  <rect width="430" height="245" rx="30" fill="#151721" stroke="#ff3156" stroke-width="2"/>
  <path d="M41 149 C80 130 135 119 202 116 L248 85 L290 87 L314 119 C350 120 379 129 395 146 L381 162 H54 Z" fill="url(#red)"/>
  <rect x="242" y="90" width="60" height="18" rx="9" fill="#fff" opacity=".9"/>
  <circle cx="113" cy="169" r="31" fill="#07080c" stroke="#ff738e" stroke-width="6"/><circle cx="335" cy="169" r="31" fill="#07080c" stroke="#ff738e" stroke-width="6"/>
  <text x="34" y="45" fill="#fff" font-size="26" font-weight="800" font-family="Arial">FORMULA 1</text>
  <text x="34" y="78" fill="#ff8499" font-size="19" font-family="Arial">engineering in milliseconds</text>
  <text x="34" y="219" fill="#fff" font-size="18" font-family="Arial">Gearbox • active aero • hybrid systems</text>
</g>

<g transform="translate(1085 205)" filter="url(#shadow)">
  <rect width="430" height="245" rx="30" fill="#211225" stroke="#ff9c3a" stroke-width="2"/>
  <g transform="translate(216 132)" filter="url(#glow)">
    <circle cx="-45" cy="-36" r="55" fill="#ef315b"/><circle cx="40" cy="-38" r="56" fill="#4c62f1"/><circle cx="-46" cy="46" r="58" fill="#5b70ff"/><circle cx="42" cy="46" r="58" fill="#e82d54"/>
    <circle cx="-45" cy="-36" r="12" fill="#ffd14b"/><circle cx="40" cy="-38" r="12" fill="#ffd14b"/><circle cx="-46" cy="46" r="12" fill="#ffd14b"/><circle cx="42" cy="46" r="12" fill="#ffd14b"/>
  </g>
  <text x="34" y="45" fill="#fff" font-size="26" font-weight="800" font-family="Arial">HEMOGLOBIN</text>
  <text x="34" y="78" fill="#ffca78" font-size="19" font-family="Arial">molecular switching in microseconds</text>
  <text x="34" y="219" fill="#fff" font-size="18" font-family="Arial">Cooperativity • O₂ loading • O₂ unloading</text>
</g>

<!-- central comparison -->
<g transform="translate(105 500)">
  <text x="0" y="0" fill="#fff" font-family="Arial" font-size="27" font-weight="800">A measured hemoglobin structural transition: <tspan fill="#ffd34a">~2 μs</tspan></text>
  <rect x="0" y="36" width="1390" height="110" rx="28" fill="#09131d" stroke="#ffffff" stroke-opacity=".15"/>
  <text x="40" y="87" fill="#aeeeff" font-family="Arial" font-size="26" font-weight="700">4 milliseconds = 4,000 microseconds</text>
  <text x="810" y="92" fill="url(#gold)" font-family="Arial" font-size="54" font-weight="900">4,000 ÷ 2 = 2,000×</text>
  <text x="40" y="128" fill="#d5e7f3" font-family="Arial" font-size="20">Illustration of different timescales — not a literal vehicle-speed race.</text>
</g>

<!-- bottom concept -->
<g transform="translate(105 700)">
  <rect width="1390" height="125" rx="30" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="34" y="48" fill="#fff" font-family="Arial" font-size="30" font-weight="900">BHOC = keep the oxygen-carrying function, change the “vehicle”</text>
  <text x="34" y="85" fill="#c8e9f8" font-family="Arial" font-size="21">Biological Hemoglobin Oxygen Carrier • cell-free architecture • Precision Oxygen Therapeutics</text>
  <text x="1090" y="82" fill="#ffd34a" font-family="Arial" font-size="28" font-weight="800">BIOLOGY TAKES POLE POSITION</text>
</g>

<text x="94" y="874" fill="#8fa7b8" font-family="Arial" font-size="15">Scientific-popular visual. The ~2 μs value refers to a specific laboratory hemoglobin R→T structural transition.</text>
</svg>