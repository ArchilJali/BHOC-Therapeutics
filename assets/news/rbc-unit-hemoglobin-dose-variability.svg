<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">One RBC unit is not a fixed hemoglobin dose</title>
<desc id="desc">Illustrative arithmetic: two components of 250 millilitres contain 40 or 60 grams of hemoglobin at 16 or 24 grams per decilitre. Same component volume, different hemoglobin mass.</desc>
<rect width="1200" height="630" fill="#f8fbfd"/><rect width="1200" height="8" fill="#a91d2a"/>
<g font-family="Arial, sans-serif"><text x="60" y="58" font-size="16" font-weight="700" letter-spacing="2" fill="#a91d2a">BHOC THERAPEUTICS · SCIENCE</text>
<text x="60" y="113" font-size="42" font-weight="700" fill="#102f49">One RBC unit ≠ a fixed Hb dose</text>
<text x="60" y="152" font-size="21" fill="#49688f">Same component volume. Different hemoglobin mass.</text>
<rect x="60" y="190" width="518" height="305" rx="20" fill="#fff" stroke="#d7e3ed" stroke-width="2"/>
<rect x="622" y="190" width="518" height="305" rx="20" fill="#fff" stroke="#d7e3ed" stroke-width="2"/>
<g fill="#fff" stroke="#102f49" stroke-width="3"><rect x="91" y="245" width="118" height="160" rx="18"/><path d="M125 245v-18h50v18M139 405v24h22v-24"/><rect x="653" y="245" width="118" height="160" rx="18"/><path d="M687 245v-18h50v18M701 405v24h22v-24"/></g>
<rect x="99" y="270" width="102" height="126" rx="11" fill="#a91d2a"/><rect x="661" y="270" width="102" height="126" rx="11" fill="#7b1118"/>
<text x="150" y="329" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">250</text><text x="150" y="356" text-anchor="middle" font-size="17" fill="#fff">mL</text>
<text x="712" y="329" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">250</text><text x="712" y="356" text-anchor="middle" font-size="17" fill="#fff">mL</text>
<text x="247" y="242" font-size="17" letter-spacing="1" fill="#637993">COMPONENT A</text><text x="809" y="242" font-size="17" letter-spacing="1" fill="#637993">COMPONENT B</text>
<text x="247" y="294" font-size="23" fill="#405c7b">16 g/dL Hb</text><text x="809" y="294" font-size="23" fill="#405c7b">24 g/dL Hb</text>
<text x="247" y="373" font-size="66" font-weight="700" fill="#102f49">40 g</text><text x="809" y="373" font-size="66" font-weight="700" fill="#102f49">60 g</text>
<text x="247" y="408" font-size="20" fill="#49688f">hemoglobin</text><text x="809" y="408" font-size="20" fill="#49688f">hemoglobin</text>
<text x="319" y="468" text-anchor="middle" font-size="19" fill="#637993">Recorded as one unit</text><text x="881" y="468" text-anchor="middle" font-size="19" fill="#637993">Recorded as one unit</text>
<text x="60" y="550" font-size="23" font-weight="700" fill="#102f49">Hb mass (g) = component volume (mL) × Hb (g/dL) ÷ 100</text>
<text x="60" y="590" font-size="17" fill="#637993">Illustrative arithmetic. Not observed patient data or a transfusion prescription.</text>
</g></svg>