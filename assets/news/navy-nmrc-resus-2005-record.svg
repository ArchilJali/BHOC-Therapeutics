<title id="title">Historical record: U.S. Navy and Biopure RESUS agreement</title>
<desc id="desc">BHOC Therapeutics editorial illustration with plain text about the 2005 Naval Medical Research Center and Biopure agreement. No official Navy seal or logo is used.</desc>
<rect width="1200" height="630" fill="#102f49"/>
<rect x="38" y="38" width="1124" height="554" rx="18" fill="#f8fafb"/>
<rect x="38" y="38" width="1124" height="11" fill="#7b1118"/>
<text x="92" y="112" fill="#7b1118" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="4">BHOC THERAPEUTICS  /  HISTORICAL RECORD</text>
<text x="92" y="222" fill="#102f49" font-family="Georgia,serif" font-size="74" font-weight="700">U.S. Navy</text>
<text x="92" y="292" fill="#102f49" font-family="Georgia,serif" font-size="43">Naval Medical Research Center</text>
<rect x="92" y="330" width="74" height="5" fill="#7b1118"/>
<text x="92" y="390" fill="#526375" font-family="Arial,Helvetica,sans-serif" font-size="30">Biopure · RESUS CRADA Amendment #3 · 2005</text>
<text x="92" y="456" fill="#102f49" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">HBOC-201 contingency clause</text>
<text x="92" y="500" fill="#526375" font-family="Arial,Helvetica,sans-serif" font-size="24">1,500 units · cost ceiling ≤ $650/unit · conditional</text>
<text x="92" y="552" fill="#7b1118" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="2">SOURCE NOTE · NOT AN OFFICIAL U.S. NAVY GRAPHIC</text>
