<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Kenya Maternal and Newborn Health Partnership | BHOC PPH Infographic</title>
<desc id="desc">BHOC editorial infographic summarizing maternal and newborn mortality in Africa and the scale of the Kenya Beginnings Fund maternal and newborn health partnership, including 80 million dollars over five years, 21 priority counties, about 200 facilities, nearly 6 million women and newborns reached, and approximately 50,000 deaths averted.</desc>
<rect width="1200" height="800" fill="#f7f3ea"/>
<rect x="0" y="0" width="1200" height="92" fill="#0f2e49"/>
<text x="48" y="44" font-family="Georgia,serif" font-size="34" fill="#ffffff">Kenya Maternal &amp; Newborn Health Partnership</text>
<text x="50" y="72" font-family="Arial,sans-serif" font-size="17" letter-spacing="2" fill="#b8c8d6">PEOPLE · PRODUCTS · SYSTEMS</text>
<rect x="48" y="108" width="8" height="600" fill="#9f2430"/>

<!-- maternal-care illustration -->
<circle cx="220" cy="260" r="66" fill="#d8c7ad"/>
<circle cx="355" cy="235" r="52" fill="#b8c8d6"/>
<path d="M130 420 C145 315 205 300 265 350 C300 300 375 300 410 405 L410 585 L130 585 Z" fill="#315b78" opacity=".95"/>
<circle cx="270" cy="375" r="42" fill="#f0dfc9"/>
<path d="M175 320 C220 355 250 355 288 325" fill="none" stroke="#9f2430" stroke-width="10" stroke-linecap="round"/>
<path d="M327 300 L375 335 M350 280 L350 352" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
<text x="130" y="625" font-family="Georgia,serif" font-size="30" fill="#173b58">Stronger systems.</text>
<text x="130" y="660" font-family="Georgia,serif" font-size="30" fill="#173b58">Healthier families.</text>
<text x="130" y="695" font-family="Georgia,serif" font-size="30" fill="#9f2430">A brighter Kenya.</text>

<!-- stats panel -->
<rect x="470" y="122" width="680" height="240" rx="18" fill="#ffffff" stroke="#d7dde2"/>
<text x="500" y="160" font-family="Georgia,serif" font-size="26" fill="#173b58">Why it matters</text>
<line x1="500" y1="176" x2="1115" y2="176" stroke="#c7d1d8"/>
<g font-family="Arial,sans-serif" fill="#173b58">
<text x="510" y="220" font-size="42" font-weight="700" fill="#9f2430">&gt;70%</text>
<text x="510" y="248" font-size="16">of global maternal deaths</text>
<text x="510" y="270" font-size="16">occur in Africa</text>

<text x="680" y="220" font-size="42" font-weight="700" fill="#9f2430">50%</text>
<text x="680" y="248" font-size="16">of global newborn deaths</text>
<text x="680" y="270" font-size="16">occur in Africa</text>

<text x="860" y="220" font-size="42" font-weight="700" fill="#9f2430">1 / 3 min</text>
<text x="860" y="248" font-size="16">maternal death</text>
<text x="860" y="270" font-size="16">WHO African Region context</text>

<text x="1010" y="220" font-size="42" font-weight="700" fill="#9f2430">2 / min</text>
<text x="1010" y="248" font-size="16">newborn deaths</text>
<text x="1010" y="270" font-size="16">WHO African Region context</text>
</g>
<text x="500" y="320" font-family="Arial,sans-serif" font-size="13" fill="#6a7f90">Mortality figures describe maternal and newborn mortality overall, not PPH alone.</text>

<!-- partnership goals -->
<rect x="470" y="385" width="680" height="250" rx="18" fill="#ffffff" stroke="#d7dde2"/>
<text x="500" y="425" font-family="Georgia,serif" font-size="26" fill="#173b58">What the partnership aims to do</text>
<line x1="500" y1="442" x2="1115" y2="442" stroke="#c7d1d8"/>
<g font-family="Arial,sans-serif">
<text x="505" y="495" font-size="34" font-weight="700" fill="#9f2430">$80M</text>
<text x="505" y="520" font-size="15" fill="#173b58">over 5 years</text>

<text x="630" y="495" font-size="34" font-weight="700" fill="#9f2430">21</text>
<text x="630" y="520" font-size="15" fill="#173b58">priority counties</text>

<text x="740" y="495" font-size="34" font-weight="700" fill="#9f2430">~200</text>
<text x="740" y="520" font-size="15" fill="#173b58">high-volume facilities</text>

<text x="880" y="495" font-size="34" font-weight="700" fill="#9f2430">~6M</text>
<text x="880" y="520" font-size="15" fill="#173b58">women &amp; newborns</text>
<text x="880" y="541" font-size="15" fill="#173b58">reached by 2031</text>

<text x="1015" y="495" font-size="34" font-weight="700" fill="#9f2430">~50K</text>
<text x="1015" y="520" font-size="15" fill="#173b58">deaths averted</text>
</g>

<rect x="500" y="565" width="190" height="45" rx="10" fill="#eef3f6"/>
<text x="515" y="593" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173b58">PEOPLE</text>
<rect x="710" y="565" width="190" height="45" rx="10" fill="#eef3f6"/>
<text x="725" y="593" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173b58">PRODUCTS</text>
<rect x="920" y="565" width="190" height="45" rx="10" fill="#eef3f6"/>
<text x="935" y="593" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173b58">SYSTEMS</text>

<!-- footer context -->
<rect x="470" y="655" width="680" height="76" rx="16" fill="#173b58"/>
<text x="500" y="688" font-family="Arial,sans-serif" font-size="18" fill="#ffffff">PPH context: when severe bleeding occurs, time, blood access</text>
<text x="500" y="714" font-family="Arial,sans-serif" font-size="18" fill="#ffffff">and oxygen delivery all matter.</text>

<text x="48" y="770" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.5" fill="#173b58">BHOC THERAPEUTICS · PRECISION OXYGEN THERAPEUTICS</text>
</svg>