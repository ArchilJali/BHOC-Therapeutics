<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
<title id="title">Red blood cell and BHOC molecular scale comparison</title>
<desc id="desc">A large red blood cell with A, B and Rh antigen markers beside a much smaller smooth red BHOC molecule.</desc>
<defs>
  <radialGradient id="rbcOuter" cx="38%" cy="27%" r="78%">
    <stop offset="0" stop-color="#ff8a82"/><stop offset=".24" stop-color="#ef4138"/><stop offset=".57" stop-color="#c71f22"/><stop offset=".84" stop-color="#7f0b14"/><stop offset="1" stop-color="#4e0710"/>
  </radialGradient>
  <radialGradient id="rbcInner" cx="50%" cy="42%" r="60%">
    <stop offset="0" stop-color="#59070d"/><stop offset=".48" stop-color="#9f151b"/><stop offset=".75" stop-color="#e73b35" stop-opacity=".56"/><stop offset="1" stop-color="#f26a62" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bhocBall" cx="32%" cy="24%" r="77%">
    <stop offset="0" stop-color="#ffd7d3"/><stop offset=".13" stop-color="#ff7970"/><stop offset=".45" stop-color="#e42d2d"/><stop offset=".78" stop-color="#9c111b"/><stop offset="1" stop-color="#590812"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="25" stdDeviation="24" flood-color="#75121a" flood-opacity=".22"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#092a61" stop-opacity=".62"/><stop offset="1" stop-color="#092a61" stop-opacity=".12"/></linearGradient>
</defs>
<ellipse cx="320" cy="525" rx="220" ry="27" fill="#791019" opacity=".10" filter="url(#soft)"/>
<g filter="url(#shadow)" transform="translate(70 5) rotate(-5 290 290)">
  <ellipse cx="300" cy="295" rx="250" ry="235" fill="url(#rbcOuter)"/>
  <ellipse cx="300" cy="292" rx="153" ry="120" fill="url(#rbcInner)"/>
  <ellipse cx="235" cy="165" rx="96" ry="34" fill="#fff" opacity=".13" transform="rotate(-24 235 165)"/>
  <path d="M117 354c58 92 191 135 311 87" fill="none" stroke="#ff8077" stroke-width="13" stroke-linecap="round" opacity=".25"/>
</g>
<g font-family="Inter,Arial,sans-serif" font-weight="700" font-size="22" fill="#092a61">
  <line x1="503" y1="129" x2="592" y2="87" stroke="#e72a2a" stroke-width="3"/><circle cx="503" cy="129" r="9" fill="#e72a2a" stroke="#fff" stroke-width="3"/><text x="608" y="94">A</text>
  <line x1="531" y1="210" x2="622" y2="183" stroke="#2d7db8" stroke-width="3"/><circle cx="531" cy="210" r="9" fill="#2d7db8" stroke="#fff" stroke-width="3"/><text x="638" y="190">B</text>
  <line x1="512" y1="329" x2="607" y2="345" stroke="#7559b7" stroke-width="3"/><circle cx="512" cy="329" r="9" fill="#7559b7" stroke="#fff" stroke-width="3"/><text x="623" y="353">Rh</text>
</g>
<line x1="598" y1="400" x2="875" y2="400" stroke="url(#line)" stroke-width="3"/>
<path d="M875 400l-15-11m15 11l-15 11" fill="none" stroke="#092a61" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="881" cy="510" rx="54" ry="12" fill="#122a4d" opacity=".12" filter="url(#soft)"/>
<circle cx="880" cy="457" r="48" fill="url(#bhocBall)" filter="url(#shadow)"/>
<ellipse cx="864" cy="440" rx="16" ry="10" fill="#fff" opacity=".30" transform="rotate(-25 864 440)"/>
</svg>
