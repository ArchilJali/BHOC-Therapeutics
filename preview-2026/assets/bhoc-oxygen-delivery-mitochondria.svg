<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">BHOC oxygen delivery toward mitochondria</title>
<desc id="desc">Multiple red mitochondria in a pale tissue environment with small smooth red oxygen-carrier elements and oxygen symbols moving toward them.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset=".52" stop-color="#eaf3fb"/><stop offset="1" stop-color="#d5e5f2"/></linearGradient>
  <radialGradient id="orb" cx="32%" cy="24%" r="76%"><stop offset="0" stop-color="#ffe3df"/><stop offset=".14" stop-color="#ff8078"/><stop offset=".46" stop-color="#e52c2d"/><stop offset=".78" stop-color="#99111a"/><stop offset="1" stop-color="#540710"/></radialGradient>
  <linearGradient id="mito" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff776d"/><stop offset=".25" stop-color="#e52b2c"/><stop offset=".72" stop-color="#a20f19"/><stop offset="1" stop-color="#610812"/></linearGradient>
  <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2ef"/><stop offset=".28" stop-color="#ffb1aa"/><stop offset=".65" stop-color="#ef554e"/><stop offset="1" stop-color="#b31820"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#ff6c62" stop-opacity=".35"/><stop offset="1" stop-color="#ff6c62" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#6d1720" flood-opacity=".24"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#2d7db8" opacity=".08"/></pattern>
</defs>
